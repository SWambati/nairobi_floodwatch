<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#F3F6FB">
    <title>Reset Password | Nairobi FloodWatch</title>
    <link rel="icon" href="/static/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #102F57;
            --blue: #1B56B3;
            --blue-dark: #174A9A;
            --muted: #617A98;
            --border: #D6E2F1;
            --surface: #FFFFFF;
            --background: #F3F6FB;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--navy);
            font-family: "Manrope", sans-serif;
        }

        .page-header {
            background: #FFFFFF;
            border-bottom: 1px solid var(--border);
            padding: 22px 6%;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            color: var(--navy);
            text-decoration: none;
        }

        .brand img {
            width: 52px;
            height: 52px;
            object-fit: contain;
        }

        .brand-title {
            display: block;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .brand-title span {
            color: var(--blue);
        }

        .brand-subtitle {
            display: block;
            margin-top: 2px;
            font-size: 13px;
            font-weight: 700;
            color: #4B92D0;
        }

        .page-container {
            width: min(100% - 36px, 530px);
            margin: 65px auto;
        }

        .reset-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px;
        }

        .reset-card h1 {
            margin: 0 0 10px;
            color: var(--navy);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .description {
            margin: 0 0 30px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
        }

        .form-group {
            margin-bottom: 23px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--navy);
            font-size: 14px;
            font-weight: 800;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            background: #EEF4FC;
            border-radius: 10px;
            transition: border-color .2s, box-shadow .2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(27,86,179,.12);
        }

        .input-wrapper input {
            width: 100%;
            min-width: 0;
            min-height: 54px;
            padding: 14px 16px;
            border: 0;
            outline: 0;
            background: transparent;
            font-family: inherit;
            font-size: 15px;
            color: var(--navy);
        }

        .eye-button {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border: 0;
            background: transparent;
            color: var(--blue);
            cursor: pointer;
        }

        .eye-button svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .eye-slash {
            display: none;
        }

        .eye-button.revealed .eye-slash {
            display: block;
        }

        .password-hint {
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.8;
        }

        .primary-button {
            width: 100%;
            min-height: 54px;
            margin-top: 8px;
            border: 0;
            border-radius: 10px;
            background: var(--blue);
            color: #FFFFFF;
            font-family: inherit;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .primary-button:hover:not(:disabled) {
            background: var(--blue-dark);
        }

        .primary-button:disabled {
            cursor: not-allowed;
            opacity: .6;
        }

        .feedback {
            margin: 0 0 24px;
            padding: 15px 17px;
            border: 1px solid #C9DCF3;
            border-radius: 10px;
            background: #EEF5FD;
            color: var(--navy);
            font-size: 14px;
            line-height: 1.8;
        }

        .feedback.error {
            border-color: #F1C8CE;
            background: #FFF0F2;
            color: #AE3041;
        }

        .feedback.success {
            border-color: #BFE5D0;
            background: #EAF8F1;
            color: #17644D;
        }

        .back-link {
            display: block;
            margin-top: 24px;
            text-align: center;
            color: var(--blue);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .page-header {
                padding: 18px;
            }

            .brand-title {
                font-size: 20px;
            }

            .page-container {
                margin: 30px auto;
            }

            .reset-card {
                padding: 25px 20px;
            }

            .reset-card h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header class="page-header">
    <a
        class="brand"
        href="/"
        aria-label="Nairobi FloodWatch home"
    >
        <img src="/static/images/logo.png" alt="">

        <span>
            <span class="brand-title">
                Flood<span>Watch</span>
            </span>

            <span class="brand-subtitle">
                Nairobi FloodWatch
            </span>
        </span>
    </a>
</header>

<main class="page-container">

    <section class="reset-card" aria-labelledby="pageTitle">

        <h1 id="pageTitle">Create a new password</h1>

        <p class="description">
            Choose a secure password for your Nairobi
            FloodWatch account.
        </p>

        <div
            id="resetFeedback"
            class="feedback"
            role="status"
            aria-live="polite"
            hidden
        ></div>

        <form id="resetForm">

            <div class="form-group">
                <label for="newPassword">
                    New password
                </label>

                <div class="input-wrapper">
                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye-button"
                        data-target="newPassword"
                        aria-label="Show new password"
                        aria-pressed="false"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                            <line class="eye-slash" x1="3" y1="21" x2="21" y2="3"/>
                        </svg>
                    </button>
                </div>

                <p class="password-hint">
                    At least 8 characters, including an uppercase
                    letter, a number and a special symbol.
                </p>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    Confirm new password
                </label>

                <div class="input-wrapper">
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye-button"
                        data-target="confirmPassword"
                        aria-label="Show confirmation password"
                        aria-pressed="false"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                            <line class="eye-slash" x1="3" y1="21" x2="21" y2="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button
                id="resetButton"
                class="primary-button"
                type="submit"
            >
                Reset password
            </button>

        </form>

        <a
            id="signInLink"
            class="back-link"
            href="/static/auth/login.html"
        >
            Back to sign in
        </a>

    </section>

</main>

<script>
"use strict";

const form = document.getElementById("resetForm");
const feedback = document.getElementById("resetFeedback");
const resetButton = document.getElementById("resetButton");

const newPasswordInput = document.getElementById("newPassword");
const confirmPasswordInput = document.getElementById("confirmPassword");

// Read the token from the URL fragment.
// The fragment is not transmitted to FastAPI by the browser.
const fragment = new URLSearchParams(
    window.location.hash.slice(1)
);

let resetToken = fragment.get("token");

// Remove the token from the visible browser URL immediately.
window.history.replaceState(
    null,
    "",
    window.location.pathname
);

function showMessage(message, type = "") {
    feedback.textContent = message;
    feedback.className = `feedback ${type}`;
    feedback.hidden = false;
}

// A recovery token is a server-generated URL-safe string.
// Never log it or store it in localStorage.
if (
    !resetToken ||
    !/^[A-Za-z0-9_-]{40,128}$/.test(resetToken)
) {
    resetToken = null;
    form.hidden = true;

    showMessage(
        "This password reset link is missing or invalid. " +
        "Please request a new password reset email.",
        "error"
    );
}

// Eye icon controls
document.querySelectorAll(".eye-button").forEach(button => {
    button.addEventListener("click", () => {
        const input = document.getElementById(
            button.dataset.target
        );

        const show = input.type === "password";

        input.type = show ? "text" : "password";

        button.classList.toggle("revealed", show);
        button.setAttribute("aria-pressed", String(show));

        button.setAttribute(
            "aria-label",
            show ? "Hide password" : "Show password"
        );
    });
});

function passwordIsValid(password) {
    return (
        password.length >= 8 &&
        password.length <= 128 &&
        /[A-Z]/.test(password) &&
        /[0-9]/.test(password) &&
        /[^A-Za-z0-9\s]/.test(password)
    );
}

form.addEventListener("submit", async event => {
    event.preventDefault();

    if (!resetToken) {
        showMessage(
            "Please request a new password reset link.",
            "error"
        );
        return;
    }

    const password = newPasswordInput.value;
    const confirmation = confirmPasswordInput.value;

    if (!passwordIsValid(password)) {
        showMessage(
            "Your password must contain at least 8 characters, " +
            "an uppercase letter, a number and a special symbol.",
            "error"
        );
        return;
    }

    if (password !== confirmation) {
        showMessage(
            "The passwords do not match.",
            "error"
        );
        return;
    }

    resetButton.disabled = true;
    resetButton.textContent = "Resetting password...";

    try {
        const response = await fetch(
            "/auth/local/reset-password",
            {
                method: "POST",
                credentials: "same-origin",
                cache: "no-store",
                referrerPolicy: "no-referrer",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    token: resetToken,
                    new_password: password
                })
            }
        );

        const result = await response.json().catch(
            () => ({})
        );

        if (!response.ok) {
            throw new Error(
                typeof result.detail === "string"
                    ? result.detail
                    : "Unable to reset your password."
            );
        }

        // Never reuse the token after a successful reset.
        resetToken = null;

        newPasswordInput.value = "";
        confirmPasswordInput.value = "";

        form.hidden = true;

        showMessage(
            "Your password has been reset successfully! " +
            "You can now sign in using your new password.",
            "success"
        );

    } catch (error) {
        showMessage(
            error.message || "Password reset failed.",
            "error"
        );

    } finally {
        resetButton.disabled = false;
        resetButton.textContent = "Reset password";
    }
});
</script>
</body>
</html>
