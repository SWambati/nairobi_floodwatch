name: FloodWatch Operational Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "7 3,15 * * *"

permissions:
  contents: read

concurrency:
  group: floodwatch-operational
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      APP_ENV: production
      FLOODWATCH_ENV: production
      APP_TIMEZONE: Africa/Nairobi
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      
      - name: Verify production artifacts
        run: |
          test -f outputs/project_outputs/models/final/random_forest_final.joblib
          test -f outputs/project_outputs/models/final/final_model_metadata.json
          test -f outputs/project_outputs/processed/modeling/risk_classification/risk_thresholds.json

          python -c "from src.model.inference import FloodInferenceEngine; m = FloodInferenceEngine(); print(m.model_info())"

          python -c "from src.model.risk_classification import FloodRiskClassifier; FloodRiskClassifier(); print('Risk thresholds: OK')"


      - name: Execute FloodWatch pipeline
        run: python -m scripts.run_operational_prediction
